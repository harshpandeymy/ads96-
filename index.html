<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>बाबा अकरम खान बंगाली | काला इल्म के माहिर</title>

<meta name="description" content="बाबा अकरम खान बंगाली से प्रेम, विवाह, कुंडली, रिश्ते, काला इल्म एवं व्यक्तिगत परामर्श के लिए WhatsApp पर संपर्क करें।">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Sans+Devanagari:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    padding:0 0 72px 0;
    background:#08050e;
    color:#f8f0df;
    font-family:"Noto Sans Devanagari",Arial,sans-serif;
    line-height:1.7;
    overflow-x:hidden;
}

a{
    text-decoration:none;
    color:inherit;
}

img{
    max-width:100%;
    display:block;
}

.container{
    width:calc(100% - 32px);
    max-width:1120px;
    margin:0 auto;
}


/* =====================================================
   COLORS
===================================================== */

:root{
    --bg:#08050e;
    --bg2:#10091a;
    --card:#120b19;
    --purple:#251133;
    --gold:#dfae55;
    --gold-light:#f6d991;
    --white:#fff8e8;
    --muted:#aaa5ae;
    --green:#11c95b;
    --green-dark:#08a64b;
    --red:#c3121c;
    --border:rgba(223,174,85,.28);
}


/* =====================================================
   STAR BACKGROUND
===================================================== */

.star-bg{
    background-image:
    radial-gradient(circle,rgba(255,255,255,.75) 1px,transparent 1.4px),
    radial-gradient(circle,rgba(223,174,85,.5) 1px,transparent 1.4px);
    background-size:105px 105px,155px 155px;
    background-position:10px 20px,60px 80px;
}


/* =====================================================
   TOP BAR
===================================================== */

.topbar{
    height:38px;
    background:#040308;
    border-bottom:1px solid rgba(223,174,85,.15);
    display:flex;
    justify-content:center;
    align-items:center;
    color:var(--gold-light);
    font-size:11px;
    text-align:center;
    padding:0 10px;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    position:absolute;
    top:38px;
    left:0;
    width:100%;
    z-index:20;
    padding:16px 0;
}

.header-inner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
}

.brand-logo{
    width:55px;
    height:55px;
    border-radius:50%;
    object-fit:cover;
    border:1px solid var(--gold);
    background:#fff;
}

.brand-name{
    font-family:"Amiri",serif;
    font-size:21px;
    font-weight:700;
    color:var(--white);
}

.header-wa{
    border:1px solid var(--border);
    border-radius:30px;
    padding:9px 16px;
    font-size:11px;
    font-weight:800;
    color:var(--gold-light);
    background:rgba(0,0,0,.35);
}


/* =====================================================
   HERO
===================================================== */

.hero{
    position:relative;
    min-height:760px;
    padding:145px 0 65px;
    display:flex;
    align-items:center;
    overflow:hidden;
}

.hero-photo{
    position:absolute;
    inset:0;
    z-index:-3;

    background-image:
    linear-gradient(
        90deg,
        rgba(7,3,12,.98) 0%,
        rgba(7,3,12,.91) 40%,
        rgba(7,3,12,.60) 100%
    ),
    url("https://img.sanishtech.com/u/02db15b2db3873f84a53ffc9f2c28cae.jpg");

    background-size:cover;
    background-position:center;
}

.hero-bottom{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:180px;
    background:linear-gradient(transparent,#08050e);
    z-index:-1;
}

.hero-content{
    width:100%;
    max-width:700px;
}

.arabic{
    font-family:"Amiri",serif;
    color:var(--gold-light);
    font-size:25px;
    margin-bottom:5px;
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:7px;
    border:1px solid var(--border);
    background:rgba(0,0,0,.28);
    border-radius:30px;
    padding:7px 15px;
    color:var(--gold-light);
    font-size:10px;
    font-weight:800;
    margin-bottom:18px;
}

.badge-dot{
    width:7px;
    height:7px;
    background:var(--gold);
    border-radius:50%;
}

h1{
    font-family:"Amiri",serif;
    font-size:clamp(50px,7vw,82px);
    line-height:1.02;
    color:var(--white);
    margin:0 0 20px 0;
}

h1 span{
    color:var(--gold-light);
}

.hero-text{
    max-width:650px;
    color:#d3ced5;
    font-size:14px;
    line-height:2;
    margin-bottom:25px;
}


/* =====================================================
   WHATSAPP MAIN BUTTON
===================================================== */

.whatsapp{
    width:100%;
    min-height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;

    padding:8px 16px 8px 19px;

    border-radius:50px;

    background:linear-gradient(
        135deg,
        #12ca5d,
        #08aa4d
    );

    border:1px solid rgba(116,255,168,.55);

    color:#fff;

    box-shadow:
    0 10px 35px rgba(7,203,89,.20);

    transition:.25s;
}

.whatsapp:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 40px rgba(7,203,89,.30);
}

.wa-left{
    display:flex;
    align-items:center;
    gap:13px;
}

.wa-icon{
    width:52px;
    height:52px;
    flex-shrink:0;
    border-radius:50%;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#09a94c;
    font-size:25px;
}

.wa-info{
    display:flex;
    flex-direction:column;
    line-height:1.25;
}

.wa-title{
    font-size:18px;
    font-weight:900;
}

.wa-sub{
    font-size:10px;
    opacity:.9;
    margin-top:4px;
}

.now{
    background:#fff;
    color:#087b3a;
    border-radius:30px;
    padding:10px 15px;
    font-size:10px;
    font-weight:900;
}


/* =====================================================
   CALL BUTTON
===================================================== */

.call{
    width:100%;
    min-height:48px;
    margin-top:9px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;

    border:1px solid rgba(255,255,255,.13);
    background:rgba(255,255,255,.035);

    border-radius:10px;

    color:#e8e2e9;
    font-size:13px;
    font-weight:700;
}

.call-icon{
    color:#efb54d;
}


/* =====================================================
   TRUST
===================================================== */

.trust{
    display:flex;
    flex-wrap:wrap;
    gap:16px;
    margin-top:18px;
    color:#aaa5ad;
    font-size:10px;
}

.trust span::before{
    content:"●";
    color:var(--gold);
    margin-right:5px;
}


/* =====================================================
   GENERAL SECTION
===================================================== */

section{
    padding:82px 0;
    position:relative;
}

.section-head{
    text-align:center;
    max-width:720px;
    margin:0 auto 43px;
}

.section-label{
    color:var(--gold-light);
    font-size:10px;
    font-weight:900;
    letter-spacing:2px;
    margin-bottom:9px;
}

h2{
    font-family:"Amiri",serif;
    color:var(--white);
    font-size:clamp(38px,5vw,58px);
    line-height:1.08;
    margin:0 0 13px;
}

.section-head p{
    color:var(--muted);
    font-size:13px;
}


/* =====================================================
   SERVICES
===================================================== */

.services{
    background:
    linear-gradient(
        180deg,
        #08050e,
        #0c0712
    );
}

.service-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:17px;
}

.service-card{
    min-height:245px;
    padding:28px 24px;

    border:1px solid var(--border);
    border-radius:19px;

    background:
    linear-gradient(
        145deg,
        rgba(42,20,56,.65),
        rgba(12,7,18,.72)
    );

    position:relative;
    overflow:hidden;
}

.service-card::after{
    content:"";
    position:absolute;
    width:100px;
    height:100px;
    border-radius:50%;
    right:-45px;
    top:-45px;
    border:1px solid rgba(223,174,85,.14);
}

.service-icon{
    width:50px;
    height:50px;
    border-radius:14px;
    border:1px solid var(--border);

    display:flex;
    align-items:center;
    justify-content:center;

    color:var(--gold-light);
    font-size:23px;

    margin-bottom:16px;
}

.service-card h3{
    font-family:"Amiri",serif;
    color:var(--white);
    font-size:28px;
    line-height:1.2;
    margin-bottom:8px;
}

.service-card p{
    color:var(--muted);
    font-size:12px;
    line-height:1.9;
}


/* =====================================================
   CTA WRAPPER
===================================================== */

.cta-wrapper{
    max-width:650px;
    margin:28px auto 0;
}


/* =====================================================
   ABOUT IMAGE SECTION
===================================================== */

.about-section{
    background:#09060f;
}

.about{
    display:grid;
    grid-template-columns:.9fr 1.1fr;
    gap:55px;
    align-items:center;
}

.about-image{
    position:relative;
}

.about-image img{
    width:100%;
    height:530px;
    object-fit:cover;
    border-radius:23px;
    border:1px solid var(--border);
}

.about-frame{
    position:absolute;
    inset:13px -13px -13px 13px;
    border:1px solid rgba(223,174,85,.25);
    border-radius:23px;
    z-index:-1;
}

.about-content h2{
    text-align:left;
}

.about-content p{
    color:var(--muted);
    font-size:13px;
    line-height:2;
    margin-bottom:15px;
}

.points{
    display:grid;
    gap:10px;
    margin:24px 0;
}

.point{
    display:flex;
    gap:11px;
    padding:13px;

    border:1px solid rgba(255,255,255,.06);
    border-radius:11px;

    background:rgba(255,255,255,.025);
}

.point-check{
    color:var(--gold-light);
    font-weight:900;
}

.point strong{
    display:block;
    font-size:12px;
}

.point small{
    display:block;
    color:var(--muted);
    font-size:10px;
}


/* =====================================================
   KALA ILM
===================================================== */

.kala{
    border-top:1px solid rgba(223,174,85,.12);
    border-bottom:1px solid rgba(223,174,85,.12);

    background:
    radial-gradient(
        circle at center,
        rgba(86,34,112,.23),
        transparent 55%
    ),
    #09050f;
}

.kala-box{
    max-width:900px;
    margin:0 auto;

    padding:50px 30px;

    text-align:center;

    border:1px solid var(--border);
    border-radius:25px;

    background:
    linear-gradient(
        145deg,
        rgba(40,19,54,.72),
        rgba(8,4,13,.85)
    );
}

.kala-symbol{
    font-family:"Amiri",serif;
    color:var(--gold-light);
    font-size:34px;
}

.kala-box p{
    max-width:720px;
    margin:0 auto 24px;
    color:var(--muted);
    font-size:13px;
    line-height:2;
}

.tags{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:9px;
    margin-bottom:27px;
}

.tags span{
    border:1px solid var(--border);
    border-radius:30px;
    padding:8px 14px;
    color:#d9d3dc;
    font-size:10px;
}


/* =====================================================
   LOVE + WEDDING
===================================================== */

.image-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:17px;
}

.image-card{
    height:480px;
    border-radius:22px;
    overflow:hidden;
    position:relative;
    border:1px solid var(--border);
    background:#100817;
}

.image-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.5s;
}

.image-card:hover img{
    transform:scale(1.04);
}

.image-overlay{
    position:absolute;
    inset:0;

    display:flex;
    align-items:flex-end;

    padding:27px;

    background:
    linear-gradient(
        to top,
        rgba(5,2,9,.96),
        transparent 65%
    );
}

.image-overlay h3{
    font-family:"Amiri",serif;
    color:var(--white);
    font-size:30px;
}


/* =====================================================
   ALL SERVICES LIST
===================================================== */

.more-services{
    background:
    linear-gradient(
        180deg,
        #09050f,
        #0d0714
    );
}

.service-list{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:13px;
}

.service-row{
    display:flex;
    align-items:center;
    gap:13px;

    padding:16px;

    border:1px solid rgba(223,174,85,.16);
    border-radius:13px;

    background:rgba(255,255,255,.025);
}

.row-icon{
    width:43px;
    height:43px;
    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:12px;

    background:rgba(223,174,85,.08);
    border:1px solid var(--border);

    color:var(--gold-light);
}

.service-row strong{
    display:block;
    font-size:12px;
}

.service-row small{
    display:block;
    color:var(--muted);
    font-size:10px;
}


/* =====================================================
   PROCESS
===================================================== */

.steps{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.step{
    padding:27px;
    border-top:1px solid var(--border);
}

.step-number{
    font-family:"Amiri",serif;
    font-size:43px;
    color:var(--gold-light);
}

.step h3{
    font-size:16px;
    margin:3px 0 8px;
}

.step p{
    color:var(--muted);
    font-size:12px;
}


/* =====================================================
   FINAL CTA
===================================================== */

.final{
    padding:0 0 90px;
}

.final-box{
    max-width:900px;
    margin:0 auto;

    padding:58px 25px;

    text-align:center;

    border:1px solid var(--border);
    border-radius:26px;

    background:
    radial-gradient(
        circle,
        rgba(223,174,85,.10),
        transparent 58%
    );
}

.final-box p{
    max-width:620px;
    margin:0 auto 25px;
    color:var(--muted);
    font-size:13px;
}


/* =====================================================
   FOOTER
===================================================== */

footer{
    border-top:1px solid rgba(223,174,85,.12);
    text-align:center;
    padding:35px 15px 95px;
    color:#85808a;
    font-size:10px;
}

.footer-name{
    font-family:"Amiri",serif;
    color:var(--gold-light);
    font-size:24px;
}


/* =====================================================
   FLOATING WHATSAPP
===================================================== */

.floating-wa{
    position:fixed;
    right:16px;
    bottom:88px;

    width:58px;
    height:58px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
    linear-gradient(
        135deg,
        #12ca5d,
        #08a74b
    );

    color:white;
    font-size:25px;

    z-index:90;

    box-shadow:
    0 9px 30px
    rgba(0,0,0,.55);
}


/* =====================================================
   BOTTOM BAR
===================================================== */

.bottom-bar{
    position:fixed;
    left:0;
    bottom:0;

    width:100%;
    height:70px;

    display:grid;
    grid-template-columns:1fr 1fr;

    z-index:100;

    box-shadow:
    0 -8px 30px
    rgba(0,0,0,.55);
}

.bottom-call{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;

    background:
    linear-gradient(
        135deg,
        #ad0c16,
        #d01820
    );

    color:white;
    font-size:16px;
    font-weight:900;
}

.bottom-wa{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;

    background:
    linear-gradient(
        135deg,
        #08a94b,
        #12c95d
    );

    color:white;
    font-size:16px;
    font-weight:900;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:800px){

    body{
        padding-bottom:70px;
    }

    .container{
        width:calc(100% - 28px);
    }

    .brand-name{
        display:none;
    }

    .header{
        top:38px;
        padding:14px 0;
    }

    .header-wa{
        font-size:10px;
        padding:8px 12px;
    }

    .hero{
        min-height:auto;
        padding:140px 0 55px;
    }

    .hero-photo{
        background-image:
        linear-gradient(
            180deg,
            rgba(7,3,12,.68),
            rgba(7,3,12,.88) 65%,
            #08050e 100%
        ),
        url("https://img.sanishtech.com/u/02db15b2db3873f84a53ffc9f2c28cae.jpg");

        background-position:center;
    }

    h1{
        font-size:54px;
    }

    .hero-text{
        font-size:13px;
        line-height:1.9;
    }

    .whatsapp{
        min-height:67px;
    }

    .wa-title{
        font-size:16px;
    }

    .wa-sub{
        font-size:9px;
    }

    .now{
        padding:9px 13px;
    }

    .trust{
        gap:9px;
    }

    section{
        padding:68px 0;
    }

    .section-head{
        margin-bottom:34px;
    }

    .service-grid{
        grid-template-columns:1fr;
    }

    .service-card{
        min-height:auto;
    }

    .about{
        grid-template-columns:1fr;
        gap:40px;
    }

    .about-image img{
        height:430px;
    }

    .about-content h2{
        text-align:left;
    }

    .kala-box{
        padding:42px 19px;
    }

    .image-grid{
        grid-template-columns:1fr;
    }

    .image-card{
        height:425px;
    }

    .service-list{
        grid-template-columns:1fr;
    }

    .steps{
        grid-template-columns:1fr;
    }

    .floating-wa{
        bottom:83px;
    }

}


/* =====================================================
   SMALL PHONE
===================================================== */

@media(max-width:390px){

    h1{
        font-size:48px;
    }

    .wa-title{
        font-size:15px;
    }

    .now{
        padding:8px 11px;
    }

}

</style>
</head>
