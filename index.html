<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>बाबा अकरम खान बंगाली | व्यक्तिगत परामर्श</title>

<meta name="description" content="बाबा अकरम खान बंगाली से प्रेम, विवाह, रिश्ते, कुंडली, काला इल्म एवं व्यक्तिगत परामर्श के लिए WhatsApp पर संपर्क करें।">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Sans+Devanagari:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

/* =========================================================
   BASIC RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#08050d;
    color:#f8f0df;
    font-family:"Noto Sans Devanagari",Arial,sans-serif;
    line-height:1.7;
    overflow-x:hidden;
    padding-bottom:72px;
}

a{
    color:inherit;
    text-decoration:none;
}

img{
    display:block;
    max-width:100%;
}

.container{
    width:calc(100% - 30px);
    max-width:1100px;
    margin:auto;
}


/* =========================================================
   COLORS
========================================================= */

:root{
    --bg:#08050d;
    --bg2:#0d0714;
    --card:#130b1b;
    --purple:#241130;
    --gold:#e2b258;
    --gold2:#f7db91;
    --white:#fff8e8;
    --muted:#aaa4ad;
    --green:#12c95d;
    --green2:#08a94c;
    --red:#c4121b;
    --border:rgba(226,178,88,.25);
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;

    background:#030207;

    border-bottom:1px solid rgba(226,178,88,.15);

    color:var(--gold2);

    font-size:11px;
    text-align:center;

    padding:0 10px;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    position:absolute;
    top:38px;
    left:0;
    width:100%;

    padding:14px 0;

    z-index:20;
}

.header-inner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.brand img{
    width:55px;
    height:55px;

    object-fit:cover;

    border-radius:50%;

    border:1px solid var(--gold);

    background:#fff;
}

.brand-name{
    font-family:"Amiri",serif;
    font-size:21px;
    font-weight:700;
}

.header-button{
    padding:9px 15px;

    border:1px solid var(--border);
    border-radius:30px;

    background:rgba(0,0,0,.35);

    color:var(--gold2);

    font-size:11px;
    font-weight:800;
}


/* =========================================================
   HERO
========================================================= */

.hero{
    position:relative;

    min-height:650px;

    padding:125px 0 55px;

    display:flex;
    align-items:flex-start;

    overflow:hidden;
}

.hero-background{
    position:absolute;
    inset:0;

    background-image:

        90deg,
        rgba(5,2,10,.97) 0%,
        rgba(5,2,10,.88) 45%,
        rgba(5,2,10,.58) 100%

    url("https://img.sanishtech.com/u/02db15b2db3873f84a53ffc9f2c28cae.jpg");

    background-size:cover;
    background-position:center;

    z-index:0;
}

.hero-background:after{
    content:"";

    position:absolute;
    inset:0;

    background-image:
    radial-gradient(
        circle,
        rgba(255,255,255,.65) 1px,
        transparent 1.4px
    );

    background-size:105px 105px;

    opacity:.35;
}

.hero-content{
    position:relative;
    z-index:2;

    width:100%;
    max-width:690px;
}

.arabic{
    font-family:"Amiri",serif;

    color:var(--gold2);

    font-size:25px;

    margin-bottom:3px;
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:7px;

    padding:7px 15px;

    border:1px solid var(--border);

    border-radius:30px;

    color:var(--gold2);

    background:rgba(0,0,0,.25);

    font-size:10px;
    font-weight:800;

    margin-bottom:17px;
}

.badge-dot{
    width:7px;
    height:7px;

    background:var(--gold);

    border-radius:50%;
}

h1{
    font-family:"Amiri",serif;

    font-size:clamp(48px,7vw,78px);

    line-height:1.04;

    color:var(--white);

    margin-bottom:17px;
}

h1 span{
    color:var(--gold2);
}

.hero-text{
    max-width:650px;

    color:#d2cbd5;

    font-size:14px;

    line-height:1.9;

    margin-bottom:22px;
}


/* =========================================================
   WHATSAPP BUTTON
========================================================= */

.wa-button{
    width:100%;

    min-height:69px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:12px;

    padding:8px 15px 8px 18px;

    border-radius:50px;

    background:
    linear-gradient(
        135deg,
        var(--green),
        var(--green2)
    );

    border:1px solid rgba(120,255,174,.55);

    box-shadow:
    0 10px 35px rgba(11,200,88,.22);

    color:#fff;

    transition:.2s;
}

.wa-button:hover{
    transform:translateY(-2px);
}

.wa-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.wa-circle{
    width:52px;
    height:52px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#fff;

    color:#08a94c;

    font-size:26px;
    font-weight:900;
}

.wa-content{
    display:flex;
    flex-direction:column;

    line-height:1.3;
}

.wa-title{
    font-size:18px;
    font-weight:900;
}

.wa-sub{
    font-size:10px;
    opacity:.92;

    margin-top:3px;
}

.wa-now{
    padding:10px 15px;

    border-radius:30px;

    background:#fff;

    color:#087b3b;

    font-size:10px;
    font-weight:900;
}


/* =========================================================
   CALL BUTTON
========================================================= */

.call-button{
    width:100%;

    min-height:48px;

    margin-top:9px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:8px;

    border:1px solid rgba(255,255,255,.13);

    background:rgba(255,255,255,.035);

    border-radius:11px;

    font-size:13px;
    font-weight:700;

    color:#e8e0e9;
}

.call-icon{
    color:var(--gold);
}


/* =========================================================
   TRUST
========================================================= */

.trust{
    display:flex;
    flex-wrap:wrap;

    gap:15px;

    margin-top:17px;

    color:#aaa4ae;

    font-size:10px;
}

.trust span:before{
    content:"●";

    color:var(--gold);

    margin-right:5px;
}


/* =========================================================
   GENERAL SECTIONS
========================================================= */

section{
    padding:75px 0;

    position:relative;
}

.section-heading{
    max-width:720px;

    text-align:center;

    margin:0 auto 40px;
}

.section-label{
    color:var(--gold2);

    font-size:10px;

    font-weight:900;

    letter-spacing:2px;

    margin-bottom:8px;
}

h2{
    font-family:"Amiri",serif;

    color:var(--white);

    font-size:clamp(38px,5vw,57px);

    line-height:1.1;

    margin-bottom:12px;
}

.section-heading p{
    color:var(--muted);

    font-size:13px;
}


/* =========================================================
   SERVICES
========================================================= */

.services-section{
    background:
    linear-gradient(
        180deg,
        #08050d,
        #0c0712
    );
}

.services-grid{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:16px;
}

.service-card{
    min-height:235px;

    padding:27px 23px;

    border:1px solid var(--border);

    border-radius:18px;

    background:
    linear-gradient(
        145deg,
        rgba(42,20,55,.65),
        rgba(12,7,18,.8)
    );

    overflow:hidden;

    position:relative;
}

.service-card:after{
    content:"";

    position:absolute;

    width:100px;
    height:100px;

    border-radius:50%;

    top:-45px;
    right:-45px;

    border:1px solid rgba(226,178,88,.15);
}

.service-icon{
    width:49px;
    height:49px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid var(--border);

    border-radius:13px;

    color:var(--gold2);

    font-size:22px;

    margin-bottom:15px;
}

.service-card h3{
    font-family:"Amiri",serif;

    color:var(--white);

    font-size:27px;

    line-height:1.2;

    margin-bottom:8px;
}

.service-card p{
    color:var(--muted);

    font-size:12px;

    line-height:1.9;
}

.cta{
    max-width:650px;

    margin:27px auto 0;
}


/* =========================================================
   IMAGE + ABOUT
========================================================= */

.about-section{
    background:#09060f;
}

.about{
    display:grid;

    grid-template-columns:.9fr 1.1fr;

    gap:50px;

    align-items:center;
}

.about-image{
    position:relative;
}

.about-image img{
    width:100%;

    height:520px;

    object-fit:cover;

    border-radius:22px;

    border:1px solid var(--border);
}

.about-image-border{
    position:absolute;

    inset:12px -12px -12px 12px;

    border:1px solid rgba(226,178,88,.25);

    border-radius:22px;

    z-index:0;
}

.about-content{
    position:relative;
    z-index:2;
}

.about-content h2{
    text-align:left;
}

.about-content p{
    color:var(--muted);

    font-size:13px;

    line-height:2;

    margin-bottom:14px;
}

.points{
    display:grid;

    gap:10px;

    margin:22px 0;
}

.point{
    display:flex;

    gap:11px;

    padding:13px;

    border:1px solid rgba(255,255,255,.06);

    border-radius:11px;

    background:rgba(255,255,255,.025);
}

.check{
    color:var(--gold2);

    font-weight:900;
}

.point strong{
    display:block;

    font-size:12px;
}

.point small{
    color:var(--muted);

    font-size:10px;
}


/* =========================================================
   KALA ILM
========================================================= */

.kala-section{
    background:
    radial-gradient(
        circle at center,
        rgba(82,31,107,.22),
        transparent 58%
    ),
    #08050d;

    border-top:1px solid rgba(226,178,88,.12);
    border-bottom:1px solid rgba(226,178,88,.12);
}

.kala-box{
    max-width:900px;

    margin:auto;

    padding:48px 28px;

    text-align:center;

    border:1px solid var(--border);

    border-radius:24px;

    background:
    linear-gradient(
        145deg,
        rgba(40,18,53,.75),
        rgba(8,4,13,.88)
    );
}

.kala-symbol{
    font-family:"Amiri",serif;

    color:var(--gold2);

    font-size:33px;
}

.kala-box p{
    max-width:720px;

    margin:0 auto 23px;

    color:var(--muted);

    font-size:13px;

    line-height:2;
}

.tags{
    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:9px;

    margin-bottom:27px;
}

.tags span{
    padding:8px 14px;

    border:1px solid var(--border);

    border-radius:30px;

    color:#d8d1db;

    font-size:10px;
}


/* =========================================================
   LOVE + WEDDING
========================================================= */

.images-section{
    background:#09060f;
}

.image-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:17px;
}

.image-card{
    height:475px;

    border-radius:22px;

    overflow:hidden;

    position:relative;

    border:1px solid var(--border);

    background:#100817;
}

.image-card img{
    width:100%;
    height:100%;

    object-fit:cover;

    transition:.4s;
}

.image-card:hover img{
    transform:scale(1.04);
}

.image-overlay{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    padding:25px;

    background:
    linear-gradient(
        to top,
        rgba(5,2,9,.97),
        transparent
    );
}

.image-overlay h3{
    font-family:"Amiri",serif;

    color:var(--white);

    font-size:30px;
}


/* =========================================================
   MORE SERVICES
========================================================= */

.more-section{
    background:
    linear-gradient(
        180deg,
        #09060f,
        #0d0714
    );
}

.service-list{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:13px;
}

.service-row{
    display:flex;

    align-items:center;

    gap:13px;

    padding:16px;

    border:1px solid rgba(226,178,88,.16);

    border-radius:13px;

    background:rgba(255,255,255,.025);
}

.row-icon{
    width:43px;
    height:43px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:12px;

    border:1px solid var(--border);

    background:rgba(226,178,88,.07);

    color:var(--gold2);
}

.service-row strong{
    display:block;

    font-size:12px;
}

.service-row small{
    display:block;

    color:var(--muted);

    font-size:10px;
}


/* =========================================================
   PROCESS
========================================================= */

.process-section{
    background:#08050d;
}

.steps{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:17px;
}

.step{
    padding:27px;

    border-top:1px solid var(--border);
}

.step-number{
    font-family:"Amiri",serif;

    color:var(--gold2);

    font-size:43px;
}

.step h3{
    font-size:16px;

    margin:2px 0 7px;
}

.step p{
    color:var(--muted);

    font-size:12px;
}


/* =========================================================
   FINAL CTA
========================================================= */

.final-section{
    padding:0 0 85px;

    background:#08050d;
}

.final-box{
    max-width:900px;

    margin:auto;

    padding:55px 25px;

    text-align:center;

    border:1px solid var(--border);

    border-radius:25px;

    background:
    radial-gradient(
        circle,
        rgba(226,178,88,.09),
        transparent 60%
    );
}

.final-box p{
    max-width:620px;

    margin:0 auto 25px;

    color:var(--muted);

    font-size:13px;
}


/* =========================================================
   FOOTER
========================================================= */

footer{
    padding:35px 15px 95px;

    text-align:center;

    border-top:1px solid rgba(226,178,88,.12);

    color:#85808a;

    font-size:10px;
}

.footer-name{
    font-family:"Amiri",serif;

    color:var(--gold2);

    font-size:24px;

    margin-bottom:4px;
}


/* =========================================================
   FLOATING WHATSAPP
========================================================= */

.floating-wa{
    position:fixed;

    right:15px;
    bottom:87px;

    width:58px;
    height:58px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
    linear-gradient(
        135deg,
        var(--green),
        var(--green2)
    );

    color:white;

    font-size:25px;

    z-index:90;

    box-shadow:
    0 8px 30px rgba(0,0,0,.55);
}


/* =========================================================
   FIXED BOTTOM BAR
========================================================= */

.bottom-bar{
    position:fixed;

    left:0;
    bottom:0;

    width:100%;

    height:70px;

    display:grid;

    grid-template-columns:1fr 1fr;

    z-index:100;

    box-shadow:
    0 -8px 30px rgba(0,0,0,.55);
}

.bottom-call{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:9px;

    background:
    linear-gradient(
        135deg,
        #aa0c15,
        #d01821
    );

    color:white;

    font-size:16px;
    font-weight:900;
}

.bottom-whatsapp{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:9px;

    background:
    linear-gradient(
        135deg,
        #08a94b,
        #12c95d
    );

    color:white;

    font-size:16px;
    font-weight:900;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px){

    .container{
        width:calc(100% - 28px);
    }

    .brand-name{
        display:none;
    }

    .header{
        padding:13px 0;
    }

    .header-button{
        font-size:10px;
        padding:8px 12px;
    }

    .hero{
        min-height:auto;

        padding:
        125px 0 50px;

        display:block;
    }

    .hero-background{
        background-image:
        linear-gradient(
            180deg,
            rgba(5,2,10,.60),
            rgba(5,2,10,.84) 55%,
            rgba(5,2,10,.98) 100%
        ),
        url("https://img.sanishtech.com/u/02db15b2db3873f84a53ffc9f2c28cae.jpg");

        background-position:center top;
    }

    .hero-content{
        max-width:100%;
    }

    .arabic{
        font-size:23px;
    }

    h1{
        font-size:50px;

        line-height:1.06;
    }

    .hero-text{
        font-size:13px;

        line-height:1.9;
    }

    .wa-button{
        min-height:67px;
    }

    .wa-circle{
        width:50px;
        height:50px;
    }

    .wa-title{
        font-size:16px;
    }

    .wa-sub{
        font-size:9px;
    }

    .wa-now{
        padding:9px 13px;
    }

    .trust{
        gap:9px;
    }

    section{
        padding:68px 0;
    }

    .section-heading{
        margin-bottom:34px;
    }

    .services-grid{
        grid-template-columns:1fr;
    }

    .service-card{
        min-height:auto;
    }

    .about{
        grid-template-columns:1fr;

        gap:40px;
    }

    .about-image img{
        height:430px;
    }

    .about-content h2{
        text-align:left;
    }

    .kala-box{
        padding:42px 18px;
    }

    .image-grid{
        grid-template-columns:1fr;
    }

    .image-card{
        height:420px;
    }

    .service-list{
        grid-template-columns:1fr;
    }

    .steps{
        grid-template-columns:1fr;
    }

    .floating-wa{
        bottom:83px;
    }

}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media(max-width:390px){

    h1{
        font-size:46px;
    }

    .wa-title{
        font-size:15px;
    }

    .wa-now{
        padding:8px 11px;
    }

}

</style>
</head>
